spring:
  application:
    name: platerelay-api
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:local-ai-disabled}
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: platerelay-impact-ledger
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/platerelay}
    username: ${DATABASE_USER:platerelay}
    password: ${DATABASE_PASSWORD:platerelay}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SECURITY_ISSUER_URI:http://localhost:9090/realms/platerelay}
          jwk-set-uri: ${SECURITY_JWK_SET_URI:http://localhost:9090/realms/platerelay/protocol/openid-connect/certs}

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  metrics:
    distribution:
      percentiles-histogram:
        "http.server.requests": true
        "platerelay.matching.duration": true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: PlateRelay
    description: Geo-aware surplus food rescue coordination API

springdoc:
  swagger-ui:
    path: /swagger-ui.html

platerelay:
  events:
    enabled: ${PLATERELAY_EVENTS_ENABLED:false}
    topic: ${PLATERELAY_EVENTS_TOPIC:platerelay.domain-events}
  ai:
    enabled: ${PLATERELAY_AI_ENABLED:false}
  expiry:
    scan-delay: ${EXPIRY_SCAN_DELAY:60000}

