services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: platerelay
      POSTGRES_USER: platerelay
      POSTGRES_PASSWORD: platerelay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platerelay -d platerelay"]
      interval: 5s
      timeout: 3s
      retries: 20

  identity:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--hostname", "http://localhost:9090"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-only
      KC_HEALTH_ENABLED: "true"
    ports:
      - "9090:8080"
    volumes:
      - ./keycloak/platerelay-realm.json:/opt/keycloak/data/import/platerelay-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:29092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      identity:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/platerelay
      DATABASE_USER: platerelay
      DATABASE_PASSWORD: platerelay
      SECURITY_ISSUER_URI: http://localhost:9090/realms/platerelay
      SECURITY_JWK_SET_URI: http://identity:8080/realms/platerelay/protocol/openid-connect/certs
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PLATERELAY_EVENTS_ENABLED: "true"
      PLATERELAY_AI_ENABLED: ${PLATERELAY_AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local-ai-disabled}
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v3.9.1
    profiles: [monitoring]
    depends_on:
      api:
        condition: service_started
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.3.1
    profiles: [monitoring]
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  postgres-data:
  kafka-data:
  grafana-data:

